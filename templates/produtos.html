{% extends "base.html" %}
{% load static %}

{% block content %}
<section class="page-header">
    <div>
        <h1>Produtos</h1>
        <p>Cadastre produtos e acompanhe o estoque disponivel.</p>
    </div>
    <button type="button" onclick="logout()">Sair</button>
</section>

<section class="content-grid">
    <article class="card">
        <h2>Novo produto</h2>
        <form id="produto-form" class="form-grid">
            <label>
                Nome
                <input id="nome" required>
            </label>
            <label>
                Categoria
                <input id="categoria" required>
            </label>
            <label>
                Preco
                <input id="preco" type="number" min="0.01" step="0.01" required>
            </label>
            <label>
                Estoque
                <input id="quantidade_estoque" type="number" min="0" step="1" required>
            </label>
            <button type="submit">Salvar produto</button>
        </form>
        <p id="produto-message" class="message"></p>
    </article>

    <article class="card">
        <h2>Produtos cadastrados</h2>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Categoria</th>
                        <th>Preco</th>
                        <th>Estoque</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="produtos-list"></tbody>
            </table>
        </div>
    </article>
</section>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/api.js' %}"></script>
<script>
requireAuth();

const form = document.getElementById("produto-form");
const list = document.getElementById("produtos-list");
const message = document.getElementById("produto-message");

async function loadProdutos() {
    const produtos = await apiFetch("/api/produtos/");
    list.innerHTML = produtos.map((produto) => `
        <tr>
            <td>${produto.nome}</td>
            <td>${produto.categoria}</td>
            <td>${formatCurrency(produto.preco)}</td>
            <td>${produto.quantidade_estoque}</td>
            <td><button type="button" data-id="${produto.id}">Excluir</button></td>
        </tr>
    `).join("");
}

form.addEventListener("submit", async (event) => {
    event.preventDefault();
    message.textContent = "";

    try {
        await apiFetch("/api/produtos/", {
            method: "POST",
            body: JSON.stringify({
                nome: document.getElementById("nome").value,
                categoria: document.getElementById("categoria").value,
                preco: document.getElementById("preco").value,
                quantidade_estoque: document.getElementById("quantidade_estoque").value,
            }),
        });
        form.reset();
        message.textContent = "Produto salvo.";
        await loadProdutos();
    } catch (error) {
        message.textContent = error.message;
    }
});

list.addEventListener("click", async (event) => {
    const id = event.target.dataset.id;
    if (!id) return;

    try {
        await apiFetch(`/api/produtos/${id}/`, { method: "DELETE" });
        await loadProdutos();
    } catch (error) {
        message.textContent = error.message;
    }
});

loadProdutos();
</script>
{% endblock %}
